<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>Offline Hybrid Signature Verifier</title>
  <style>
    body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; padding: 30px; max-width: 800px; margin: auto; background-color: #f9f9f9; }
    .container { background: white; padding: 30px; border-radius: 8px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
    h2 { color: #333; margin-top: 0; }
    label { font-weight: bold; margin-top: 15px; display: block; color: #555; }
    input, textarea { width: 100%; margin-top: 5px; padding: 12px; font-family: monospace; border: 1px solid #ccc; border-radius: 4px; box-sizing: border-box; }
    button { margin-top: 20px; padding: 12px 24px; font-size: 16px; font-weight: bold; background-color: #0056b3; color: white; border: none; border-radius: 4px; cursor: pointer; }
    button:hover { background-color: #004494; }
    pre { background: #1e1e1e; color: #00ff00; padding: 15px; border-radius: 4px; white-space: pre-wrap; font-family: monospace; min-height: 150px; overflow-x: auto; }
    .note { font-size: 0.9em; color: #666; font-style: italic; margin-bottom: 20px; }
  </style>
  <!-- This script will be generated by Dart in the next step -->
  <script defer src="main.js"></script>
</head>
<body>
  <div class="container">
    <h2>Offline Hybrid Verification Tool</h2>
    <p class="note">This independent tool runs entirely in your local browser. No internet connection or server is required to verify signatures.</p>
    
    <label>File Hash (Hex):</label>
    <input type="text" id="fileHash" placeholder="e.g. 5c2613d3...">

    <label>Hybrid Signature (Base64):</label>
    <textarea id="signature" rows="4" placeholder="Paste Base64 Signature..."></textarea>

    <label>Hybrid Public Key (Base64):</label>
    <textarea id="publicKey" rows="4" placeholder="Paste Base64 Public Key..."></textarea>

    <button id="verifyBtn">Verify Signature</button>

    <label>Audit Log:</label>
    <pre id="output">System Ready. Awaiting input...</pre>
  </div>
</body>
</html>
